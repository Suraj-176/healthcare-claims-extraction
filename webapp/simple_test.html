<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ultra Simple Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body style="padding: 2rem;">
    <h1>🧪 Ultra Simple Button Test</h1>
    
    <div style="margin: 2rem 0; padding: 2rem; border: 3px solid red;">
        <h2>Test 1: Inline onclick</h2>
        <button class="btn btn-primary" onclick="alert('✅ WORKS!')">
            Click Me - Inline Alert
        </button>
    </div>

    <div style="margin: 2rem 0; padding: 2rem; border: 3px solid orange;">
        <h2>Test 2: Function call</h2>
        <button class="btn btn-success" onclick="testFunc()">
            Click Me - Function Call
        </button>
    </div>

    <div style="margin: 2rem 0; padding: 2rem; border: 3px solid blue;">
        <h2>Test 3: Button group like Results page</h2>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" onclick="viewExtraction(1)">
                <i class="bi bi-eye"></i>
            </button>
            <button class="btn btn-outline-danger" onclick="deleteExtraction(1)">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>

    <div id="output" style="margin-top: 2rem; padding: 1rem; background: #f0f0f0; min-height: 100px; font-family: monospace;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += msg + '<br>';
            console.log(msg);
        }

        function testFunc() {
            log('✅ testFunc() executed!');
            alert('✅ testFunc works!');
        }

        function viewExtraction(id) {
            log('👁️ viewExtraction(' + id + ') executed!');
            alert('👁️ View button works! ID: ' + id);
        }

        function deleteExtraction(id) {
            log('🗑️ deleteExtraction(' + id + ') executed!');
            alert('🗑️ Delete button works! ID: ' + id);
        }

        window.testFunc = testFunc;
        window.viewExtraction = viewExtraction;
        window.deleteExtraction = deleteExtraction;

        log('✅ Page loaded');
        log('✅ Functions registered');
        log('');
        log('👆 Click buttons above to test!');
    </script>
</body>
</html>
